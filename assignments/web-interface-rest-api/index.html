<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Catalog</title>
  </head>
  <body>
    <main>
      <h1>Book Catalog</h1>

      <p id="status" role="status" aria-live="polite"></p>

      <section aria-labelledby="form-heading">
        <h2 id="form-heading">Add or edit a book</h2>
        <form id="book-form">
          <label for="book-id">ID</label>
          <input id="book-id" name="id" type="number" required />

          <label for="book-title">Title</label>
          <input id="book-title" name="title" type="text" required />

          <label for="book-author">Author</label>
          <input id="book-author" name="author" type="text" required />

          <button type="submit">Save book</button>
          <button id="cancel-edit" type="button" hidden>Cancel edit</button>
        </form>
      </section>

      <section aria-labelledby="books-heading">
        <h2 id="books-heading">Books</h2>
        <button id="refresh-books" type="button">Refresh list</button>
        <ul id="book-list"></ul>
      </section>
    </main>

    <script>
      const API_URL = "http://localhost:8000";
      const bookForm = document.querySelector("#book-form");
      const bookList = document.querySelector("#book-list");
      const statusMessage = document.querySelector("#status");
      const cancelEditButton = document.querySelector("#cancel-edit");

      let editingBookId = null;

      async function loadBooks() {}

      function renderBooks(books) {}

      function startEditing(book) {}

      function resetForm() {}

      bookForm.addEventListener("submit", async (event) => {
        event.preventDefault();
      });

      cancelEditButton.addEventListener("click", resetForm);
      document.querySelector("#refresh-books").addEventListener("click", loadBooks);

      loadBooks();
    </script>
  </body>
</html>
